name: Deploy bot to EC2

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: students_new

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up SSH key for EC2
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Clean and prepare remote folder
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "
            set -e
            echo '🧹 Removing old folder and creating a new one...'
            rm -rf ~/tutor_bot
            mkdir -p ~/tutor_bot
          "

      - name: Upload project to EC2
        run: |
          echo '📦 Uploading project to server...'
          scp -o StrictHostKeyChecking=no -r . "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/tutor_bot"

      - name: Setup, install, and restart bot
        env:
          CREDS_INI_CONTENT: ${{ secrets.CREDS_INI_CONTENT }}
          MONGO_URI:         ${{ secrets.MONGO_URI }}
          MONGO_HOST:        ${{ secrets.MONGO_HOST }}
          MONGO_PORT:        ${{ secrets.MONGO_PORT }}
          MONGO_USERNAME:    ${{ secrets.MONGO_USERNAME }}
          MONGO_PASSWORD:    ${{ secrets.MONGO_PASSWORD }}
          CREDS_PATH:        ${{ secrets.CREDS_PATH }}
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "
            set -e
            echo '🚀 cd project'
            cd ~/tutor_bot

            echo '📁 logs'
            mkdir -p logs
            : > logs/bot_stdout.log
            : > logs/bot_stderr.log
            chmod 666 logs/bot_stdout.log logs/bot_stderr.log

            echo '🔧 install Poetry (idempotent)'
            curl -sSL https://install.python-poetry.org | python3 - || true
            export PATH=\"\$HOME/.local/bin:\$HOME/.poetry/bin:\$PATH\"
            if command -v poetry >/dev/null 2>&1; then
              POETRY=\$(command -v poetry)
            elif [ -x \"\$HOME/.local/bin/poetry\" ]; then
              POETRY=\"\$HOME/.local/bin/poetry\"
            elif [ -x \"\$HOME/.poetry/bin/poetry\" ]; then
              POETRY=\"\$HOME/.poetry/bin/poetry\"
            else
              echo '❌ Poetry not found after install'; exit 1
            fi
            echo \"Poetry -> \$POETRY\"

            echo '📜 write creds.ini'
            printf '%s' \"$CREDS_INI_CONTENT\" > creds.ini

            echo '🌍 write /etc/default/tutor_bot'
            echo \"MONGO_URI=$MONGO_URI\"       | sudo tee  /etc/default/tutor_bot > /dev/null
            echo \"MONGO_HOST=$MONGO_HOST\"     | sudo tee -a /etc/default/tutor_bot > /dev/null
            echo \"MONGO_PORT=$MONGO_PORT\"     | sudo tee -a /etc/default/tutor_bot > /dev/null
            echo \"MONGO_USERNAME=$MONGO_USERNAME\" | sudo tee -a /etc/default/tutor_bot > /dev/null
            echo \"MONGO_PASSWORD=$MONGO_PASSWORD\" | sudo tee -a /etc/default/tutor_bot > /dev/null
            echo \"CREDS_PATH=$CREDS_PATH\" | sudo tee -a /etc/default/tutor_bot > /dev/null
            sudo chmod 644 /etc/default/tutor_bot

            echo '📦 install deps'
            rm -f poetry.lock
            \"\$POETRY\" config virtualenvs.in-project true
            \"\$POETRY\" install --no-interaction

            echo '🔁 systemd reload & (re)start'
            sudo systemctl daemon-reexec || true
            sudo systemctl daemon-reload || true
            sudo systemctl restart tutor_bot || sudo systemctl start tutor_bot

            echo '✅ deploy finished'
          "
