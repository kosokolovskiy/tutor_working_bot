name: Deploy bot to EC2 (dev)

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PACKAGE_VERSION: "0.0.2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up SSH key for EC2
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Clean and prepare remote folder
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" <<'SSH'
            set -e
            rm -rf ~/tutor_bot
            mkdir -p ~/tutor_bot
          SSH

      - name: Upload project to EC2
        run: |
          scp -o StrictHostKeyChecking=no -r . "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/tutor_bot"

      - name: Setup, install, and restart bot
        env:
          CREDS_INI_CONTENT: ${{ secrets.CREDS_INI_CONTENT }}
          MONGO_URI: ${{ secrets.MONGO_URI }}      # задавай сразу URI (реплика-сет)
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
        run: |
          # Передаём PACKAGE_VERSION внутрь удалённой сессии явным экспортом
          ssh -o StrictHostKeyChecking=no "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "export PACKAGE_VERSION='${PACKAGE_VERSION}'; bash -s" <<'SSH'
            set -e
            cd ~/tutor_bot

            echo '📁 Create logs folder and log files + rights'
            mkdir -p logs && touch logs/bot_stdout.log logs/bot_stderr.log && chmod 666 logs/*.log

            echo '🔧 Setting up Poetry'
            curl -sSL https://install.python-poetry.org | python3 - || true
            export PATH="$HOME/.local/bin:$PATH"

            echo '📜 create creds.ini from secret'
            # используем printf, чтобы сохранить переводы строк
            printf '%s' "$CREDS_INI_CONTENT" > creds.ini

            echo '📜 Create /etc/default/tutor_bot env file'
            # твой код читает именно MONGO_URI
            echo "export MONGO_URI=$MONGO_URI" | sudo tee /etc/default/tutor_bot > /dev/null
            sudo chmod 644 /etc/default/tutor_bot

            echo '📦 Pin kosokolovsky_telegram_bot from Git tag and install deps'
            # git почти наверняка уже есть; если нет — ставить можно отдельно
            rm -f poetry.lock
            poetry remove kosokolovsky-telegram-bot || true
            poetry remove kosokolovsky_telegram_bot || true
            poetry config virtualenvs.in-project true
            rm -rf .venv || true

            # Сформируем ОДИН цельный PEP-508 аргумент для Poetry 2.x
            REQ="kosokolovsky_telegram_bot @ git+https://github.com/kosokolovskiy/tutor_telegram_bot.git@${PACKAGE_VERSION}"
            poetry add "$REQ" --no-interaction

            poetry install --no-interaction

            echo '🔁 Restart systemd service'
            sudo systemctl daemon-reexec
            sudo systemctl daemon-reload
            sudo systemctl restart tutor_bot

            echo '✅ Deployment is finished!'
          SSH
