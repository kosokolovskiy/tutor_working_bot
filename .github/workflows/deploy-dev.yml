name: Deploy bot to EC2

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: students_new

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up SSH key for EC2
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Clean and prepare remote folder
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" <<'SSH'
            set -e
            echo "🧹 Removing old folder and creating a new one..."
            rm -rf ~/tutor_bot
            mkdir -p ~/tutor_bot
          SSH

      - name: Upload project to EC2
        run: |
          echo "📦 Uploading project to server..."
          scp -o StrictHostKeyChecking=no -r . "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/tutor_bot"

      # >>> добавили отдельную заливку creds.ini (надёжно с многострочным секретом)
      - name: Upload creds.ini securely
        env:
          CREDS_INI_CONTENT: ${{ secrets.CREDS_INI_CONTENT }}
        run: |
          printf '%s' "$CREDS_INI_CONTENT" > /tmp/creds.ini
          scp -o StrictHostKeyChecking=no /tmp/creds.ini "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/tutor_bot/creds.ini"
          rm -f /tmp/creds.ini

      - name: Setup, install, and restart bot
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}   # один секрет с готовым URI
          EC2_USER:  ${{ secrets.EC2_USER }}    # чтобы подставить в unit путь/юзера
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "bash -s" <<'SSH'
            set -e
            echo '🚀 cd to project'
            cd ~/tutor_bot

            echo '📁 ensure logs exist'
            mkdir -p logs
            : > logs/bot_stdout.log
            : > logs/bot_stderr.log
            chmod 666 logs/bot_stdout.log logs/bot_stderr.log

            echo '🔧 install Poetry if needed'
            curl -sSL https://install.python-poetry.org | python3 - || true
            export PATH="$HOME/.local/bin:$PATH"

            echo '🌍 write systemd env file'
            # MONGO_URI мы не знаем тут — передадим через shell vars ниже (см. EOF команду)
            # сам файл создадим одной командой внутри "EOF"-блока
            :

            echo '📦 install deps with Poetry'
            rm -f poetry.lock
            poetry config virtualenvs.in-project true
            poetry install --no-interaction

            # --- ensure systemd unit exists (one-time) ---
            if [ ! -f /etc/systemd/system/tutor_bot.service ]; then
              echo '🛠 Create systemd unit /etc/systemd/system/tutor_bot.service'
              sudo tee /etc/systemd/system/tutor_bot.service >/dev/null <<UNIT
[Unit]
Description=Tutor Telegram Bot
After=network-online.target mongod.service
Wants=network-online.target

[Service]
Type=simple
User=${EC2_USER}
WorkingDirectory=/home/${EC2_USER}/tutor_bot
EnvironmentFile=/etc/default/tutor_bot
ExecStart=/home/${EC2_USER}/tutor_bot/.venv/bin/python src/run_bot.py
Restart=always
RestartSec=3
KillSignal=SIGINT
TimeoutStopSec=30

[Install]
WantedBy=multi-user.target
UNIT

              sudo systemctl daemon-reload
              sudo systemctl enable tutor_bot
            fi

            # Запишем MONGO_URI сейчас (его мы передадим через STDIN ниже)
            sudo tee /etc/default/tutor_bot >/dev/null <<ENVF
export MONGO_URI=__WILL_BE_INJECTED__
ENVF
            sudo chmod 644 /etc/default/tutor_bot

            echo '🔁 restart systemd service'
            sudo systemctl daemon-reexec
            sudo systemctl daemon-reload
            sudo systemctl restart tutor_bot || true
            sudo systemctl status --no-pager tutor_bot || true
            sudo journalctl -u tutor_bot -n 80 --no-pager || true

            echo '✅ deploy finished'
          SSH

          # <<< ВАЖНО: после heredoc заменим плейсхолдер на реальный URI одной ssh-командой
          ssh -o StrictHostKeyChecking=no "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "sudo sed -i 's|export MONGO_URI=__WILL_BE_INJECTED__|export MONGO_URI=${MONGO_URI//|/\\|}|' /etc/default/tutor_bot && sudo systemctl restart tutor_bot"
